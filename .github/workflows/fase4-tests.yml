name: Fases 3 y 4 - Express y Supabase
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Iniciar Supabase exclusivamente local
        run: |
          npm run setup -- --local
      - name: Integración real sin Edge Function adicional
        run: |
          npm run test:integration
          npm run test:sessions:local
          npm run test:browser:local
      - name: Verificar comando único de desarrollo
        run: |
          mkdir -p .tmp
          npm run dev > .tmp/express.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 20); do
            if curl -fsS http://localhost:3000/api/health; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Detener pila local
        if: always()
        run: npx supabase stop --no-backup
